<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiples</title>
</head>
<body>

    <h1>Multiples of 3 or 5</h1>
    <p id="result"></p>

    <script>
        let multiples = [];

        for (let n = 1; n < 1000; n++) {
            if (n % 3 === 0 || n % 5 === 0) {
                multiples.push(n);
            }
        }

        // Display the result
        document.getElementById("result").textContent = multiples.join(", ");
    </script>

</body>
</html>
